# lichess-bot configuration for Nest.
#
# setup.sh copies this file to lichess/config.yml and fills in the @...@
# placeholders. Edit lichess/config.yml, not this template.
#
# The token is NOT stored here: run.sh passes it to lichess-bot through the
# LICHESS_BOT_TOKEN environment variable, which overrides the value below.

token: "set-LICHESS_BOT_TOKEN-in-the-environment"
url: "https://lichess.org/"

engine:
  dir: "@ENGINE_DIR@"
  name: "nest"
  working_dir: "@ENGINE_DIR@"
  debug: false
  protocol: "uci"
  ponder: false              # set to true to think on the opponent's time (uses the CPU constantly)
  polyglot:
    enabled: false
    book:
      standard: []
    min_weight: 1
    selection: "weighted_random"
    max_depth: 20
    normalization: "none"
  draw_or_resign:
    resign_enabled: true
    resign_score: -1000
    resign_for_egtb_minus_two: true
    resign_moves: 5
    offer_draw_enabled: true
    offer_draw_score: 0
    offer_draw_for_egtb_zero: true
    offer_draw_moves: 12
    offer_draw_pieces: 10
  online_moves:
    max_out_of_book_moves: 10
    max_retries: 2
    chessdb_book:
      enabled: false
      min_time: 20
      max_time: 10800
      move_quality: "good"
      min_depth: 20
    lichess_cloud_analysis:
      enabled: false
      min_time: 20
      max_time: 10800
      move_quality: "best"
      max_score_difference: 50
      min_depth: 20
      min_knodes: 0
    lichess_opening_explorer:
      enabled: false
      min_time: 20
      max_time: 10800
      source: "masters"
      player_name: ""
      sort: "winrate"
      min_games: 10
    online_egtb:
      enabled: false
      min_time: 20
      max_time: 10800
      max_pieces: 7
      source: "lichess"
      move_quality: "best"
  lichess_bot_tbs:
    syzygy:
      enabled: false
      paths: []
      max_pieces: 7
      move_quality: "best"
    gaviota:
      enabled: false
      paths: []
      max_pieces: 5
      min_dtm_to_consider_as_wdl_1: 120
      move_quality: "best"
  homemade_options:
  # Only options Nest actually has may be listed here.
  uci_options:
    Move Overhead: 150       # ms kept in reserve per move, on top of move_overhead below
    Threads: @THREADS@
    Hash: @HASH@
    UCI_ShowWDL: true
  silence_stderr: false

abort_time: 30
fake_think_time: false
rate_limiting_delay: 0
move_overhead: 1500          # ms lichess-bot subtracts from the clock for network delay
max_takebacks_accepted: 0
quit_after_all_games_finish: false

correspondence:
  move_time: 60
  checkin_period: 300
  disconnect_time: 150
  ponder: false

challenge:
  concurrency: 1             # one game at a time: the engine gets the whole machine
  games_reserved_for_humans: 0
  sort_by: "best"
  preference: "none"
  accept_bot: true
  only_bot: false
  max_increment: 30
  min_increment: 0
  max_base: 1800
  min_base: 60
  max_days: 14
  min_days: 1
  variants:
    - standard
  time_controls:
    - bullet
    - blitz
    - rapid
    - classical
  modes:
    - casual
    # - rated                # enable once you are happy with how it plays
  bullet_requires_increment: true
  max_simultaneous_games_per_user: 1

greeting:
  hello: "Hi! I'm {me}, running the Nest engine. Good luck!"
  goodbye: "Good game!"
  hello_spectators: "Hi! I'm {me}, running the Nest engine."
  goodbye_spectators: "Thanks for watching!"

matchmaking:
  allow_matchmaking: false   # set to true to make the bot challenge other bots itself
  allow_during_games: false
  challenge_variant: "random"
  challenge_timeout: 30
  challenge_initial_time:
    - 180
    - 300
  challenge_increment:
    - 2
    - 3
  opponent_rating_difference: 300
  rating_preference: "none"
  challenge_mode: "casual"
  challenge_filter: none
  include_challenge_block_list: false
